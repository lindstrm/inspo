name: Docker build check

# Validates that the image builds on every push to main and every pull request.
# It builds the Dockerfile but does NOT push — a fast guard so a broken build is
# caught here instead of when you cut a release.
on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when newer commits land on the same branch/PR.
concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: inspo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
